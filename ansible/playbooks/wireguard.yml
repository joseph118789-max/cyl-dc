---
- name: WireGuard VPN Configuration for pve and pve2
  hosts: pve_nodes
  gather_facts: true
  become: true

  vars:
    wireguard_internal_ip: "{{ hostvars[inventory_hostname].wireguard_ip }}"
    wireguard_listen_port: 51820
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard
        state: present
        update_cache: no
      ignore_errors: true

    - name: Reboot to load WireGuard kernel module
      ansible.builtin.reboot:
        reboot_timeout: 300
      ignore_errors: true

    - name: Generate WireGuard private key
      ansible.builtin.shell: wg genkey
      register: wg_private_key_raw
      changed_when: false
      ignore_errors: true

    - name: Set WireGuard private key fact
      ansible.builtin.set_fact:
        wg_private_key: "{{ wg_private_key_raw.stdout }}"
      when: wg_private_key_raw.stdout is defined

    - name: Generate WireGuard public key
      ansible.builtin.shell: "echo {{ wg_private_key }} | wg pubkey"
      register: wg_public_key_raw
      changed_when: false
      when: wg_private_key is defined
      ignore_errors: true

    - name: Set WireGuard public key fact
      ansible.builtin.set_fact:
        wg_public_key: "{{ wg_public_key_raw.stdout }}"
      when: wg_public_key_raw.stdout is defined

    - name: Create WireGuard config directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: '0755'

    - name: Configure WireGuard wg0
      ansible.builtin.copy:
        content: |
          [Interface]
          Address = {{ wireguard_internal_ip }}
          PrivateKey = {{ wg_private_key | default('REPLACE_WITH_PRIVATE_KEY') }}
          ListenPort = {{ wireguard_listen_port }}
          MTU = 1420

        dest: /etc/wireguard/wg0.conf
        mode: '0600'
      ignore_errors: true

    - name: Enable and start WireGuard
      ansible.builtin.systemd:
        name: wireguard
        enabled: true
        state: started
      ignore_errors: true

    - name: Show WireGuard status
      ansible.builtin.shell: wg show
      changed_when: false
      ignore_errors: true

    - name: Debug WireGuard info
      ansible.builtin.debug:
        msg: "Node: {{ inventory_hostname }}, Internal IP: {{ wireguard_internal_ip }}, Public Key: {{ wg_public_key | default('NOT_CONFIGURED') }}"