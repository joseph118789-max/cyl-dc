---
# Patroni HA PostgreSQL cluster across 2 PVE sites
# ================================================
# Architecture (3 VMs, 2 sites):
#   PVE1 (Site 1, 192.168.1.x):
#     pg-a  (openclaw01, 192.168.1.239 / 10.0.0.5):
#       Postgres Node A + Patroni + etcd member 1
#   PVE2 (Site 2, 192.168.11.x):
#     pg-b  (VM 105, 192.168.11.239 / 10.0.0.6):
#       Postgres Node B + Patroni + etcd member 2
#     etcd3 (VM 106, 192.168.11.240 / 10.0.0.7):
#       etcd member 3 only (NO PostgreSQL, NO Patroni)
#
# Quorum: 3 etcd votes total. Automatic failover works as long as
# at least 2 of 3 etcd members are reachable.
#
# If PVE2 goes completely offline: pg-a has 1/3 etcd votes,
# cannot reach quorum, will NOT auto-failover. This is correct
# behavior to avoid split-brain. True host-level HA needs a 3rd
# physical failure domain.
#
# Inventory groups:
#   patroni_data_nodes : pg-a, pg-b  (PostgreSQL + Patroni)
#   etcd_nodes         : pg-a, pg-b, etcd3  (etcd only)
#   haproxy_nodes      : pg-a, pg-b  (HAProxy + PgBouncer)
#
# Ports:
#   etcd peer:   2380/tcp
#   etcd client: 2379/tcp
#   Patroni API: 8008/tcp
#   Postgres:    5432/tcp
#   HAProxy:     5000/tcp (PgBouncer), 5432/5433 (db), 5001 (stats)
#
# Verification:
#   patronictl -c /etc/patroni/patroni.yml list
#   etcdctl endpoint health
#   etcdctl member list

- name: "Patroni HA – Prerequisites (data nodes only)"
  hosts: patroni_data_nodes
  gather_facts: true
  become: true
  vars:
    pg_version: "16"
    pg_port: 5432
    pg_data_dir: "/var/lib/postgresql/{{ pg_version }}/main"
    pg_max_connections: 200
    pg_shared_buffers: "256MB"

  tasks:
    - name: "Fail if any password is still a CHANGE_ME placeholder"
      ansible.builtin.assert:
        that:
          - patroni_postgres_password != "CHANGE_ME_postgres_password"
          - patroni_replicator_password != "CHANGE_ME_replicator_password"
          - haproxy_stats_password != "CHANGE_ME_haproxy_stats_password"
        fail_msg: >
          ERROR: One or more passwords are still set to CHANGE_ME_* placeholders.
          Encrypt group_vars/patroni_cluster.yml with ansible-vault and replace
          all CHANGE_ME_* values before applying this playbook.
        success_msg: "All passwords replaced — safe to proceed"

    - name: "Ensure Python + pip + build deps"
      ansible.builtin.apt:
        pkg:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - libpq-dev
          - build-essential
          - libssl-dev
          - pkg-config
          - netcat-openbsd
        update_cache: true
        state: present

    - name: "Stop + disable default PostgreSQL (Patroni manages it)"
      ansible.builtin.systemd:
        name: "postgresql"
        state: stopped
        enabled: false
      failed_when: false

    - name: "Install PostgreSQL {{ pg_version }}"
      ansible.builtin.apt:
        pkg:
          - "postgresql-{{ pg_version }}"
          - "postgresql-client-{{ pg_version }}"
          - "postgresql-contrib-{{ pg_version }}"
        state: present

    - name: "Generate en_US.UTF-8 locale (required for initdb)"
      ansible.builtin.command: locale-gen en_US.UTF-8
      args:
        creates: /usr/lib/locale/en_US.UTF-8
      changed_when: false

    - name: "Install Patroni via pip"
      ansible.builtin.pip:
        name:
          - "patroni[etcd]==4.0.1"
          - "psycopg2-binary"
        virtualenv: /opt/patroni-venv
        virtualenv_command: "python3 -m venv"
        state: present

    - name: "Create Patroni config dir"
      ansible.builtin.file:
        path: "/etc/patroni"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Create postgres data dir"
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: "Create patroni run dir"
      ansible.builtin.file:
        path: "/run/patroni"
        state: directory
        owner: root
        mode: "0755"


- name: "Patroni HA – etcd cluster (all 3 members)"
  hosts: etcd_nodes
  gather_facts: true
  become: true
  vars:
    etcd_version: "3.5.17"
    etcd_members:
      - { name: "pg-a",   ip: "10.0.0.5" }
      - { name: "pg-b",   ip: "10.0.0.6" }
      - { name: "etcd3",  ip: "10.0.0.7" }
    # Tuned for ~50ms cross-site RTT between PVE1 and PVE2
    etcd_heartbeat_interval: "500"
    etcd_election_timeout: "5000"

  tasks:
    - name: "Install etcd binaries (download if not present)"
      block:
        - name: "Check if etcd binary exists"
          ansible.builtin.stat:
            path: "/usr/local/bin/etcd"
          register: etcd_binary

        - name: "Download etcd {{ etcd_version }}"
          ansible.builtin.get_url:
            url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
            dest: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
            mode: "0644"
          when: not etcd_binary.stat.exists

        - name: "Extract etcd"
          ansible.builtin.unarchive:
            src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
            dest: "/tmp"
            remote_src: true
            creates: "/tmp/etcd-v{{ etcd_version }}-linux-amd64"
          when: not etcd_binary.stat.exists

        - name: "Install etcd binaries"
          ansible.builtin.copy:
            remote_src: true
            src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
            dest: "/usr/local/bin/{{ item }}"
            mode: "0755"
          loop:
            - etcd
            - etcdctl
          when: not etcd_binary.stat.exists

    - name: "Create etcd data dir"
      ansible.builtin.file:
        path: "/var/lib/etcd"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Generate etcd initial cluster string"
      ansible.builtin.set_fact:
        etcd_initial_cluster: >-
          {%- set parts = [] -%}
          {%- for m in etcd_members -%}
          {%- set _ = parts.append(m.name + '=http://' + m.ip + ':2380') -%}
          {%- endfor -%}
          {{ parts | join(',') }}

    - name: "Create etcd config dir"
      ansible.builtin.file:
        path: "/etc/etcd"
        state: directory
        mode: "0755"

    - name: "Write etcd config"
      ansible.builtin.template:
        src: "../templates/etcd.conf.yml.j2"
        dest: "/etc/etcd/etcd.conf.yml"
        mode: "0644"
        owner: root
        group: root

    - name: "Create etcd systemd override dir"
      ansible.builtin.file:
        path: "/etc/systemd/system/etcd.service.d"
        state: directory
        mode: "0755"

    - name: "Create etcd systemd unit"
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=etcd key-value store
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=notify
          ExecStart=/usr/local/bin/etcd --config-file=/etc/etcd/etcd.conf.yml
          Restart=always
          RestartSec=10s
          LimitNOFILE=40000

          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/etcd.service"
        mode: "0644"
        owner: root
        group: root

    - name: "Daemon-reload etcd"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Enable + start etcd"
      ansible.builtin.systemd:
        name: etcd
        state: started
        enabled: true


- name: "Patroni HA – Verify etcd cluster health"
  hosts: pg-a
  gather_facts: false
  become: false
  vars:
    etcd_members:
      - { name: "pg-a",   ip: "10.0.0.5" }
      - { name: "pg-b",   ip: "10.0.0.6" }
      - { name: "etcd3",  ip: "10.0.0.7" }

  tasks:
    - name: "Generate etcdctl endpoints"
      ansible.builtin.set_fact:
        etcdctl_endpoints: >-
          {%- for m in etcd_members -%}
          http://{{ m.ip }}:2379{% if not loop.last %},{% endif %}
          {%- endfor %}

    - name: "Wait for etcd cluster to form (60s)"
      ansible.builtin.wait_for:
        timeout: 60

    - name: "Check etcd cluster health"
      ansible.builtin.shell: |
        export ETCDCTL_ENDPOINTS="{{ etcdctl_endpoints }}"
        etcdctl endpoint health --cluster
      register: etcd_health
      failed_when: false

    - name: "Show etcd health"
      ansible.builtin.debug:
        msg: "{{ etcd_health.stdout }}{{ etcd_health.stderr }}"

    - name: "List etcd members"
      ansible.builtin.shell: |
        export ETCDCTL_ENDPOINTS="{{ etcdctl_endpoints }}"
        etcdctl member list
      register: etcd_members_list
      failed_when: false

    - name: "Show etcd members"
      ansible.builtin.debug:
        msg: "{{ etcd_members_list.stdout }}"


- name: "Patroni HA – Patroni config (all data nodes)"
  hosts: patroni_data_nodes
  gather_facts: true
  become: true
  vars:
    pg_version: "16"
    etcd_members:
      - { name: "pg-a",   ip: "10.0.0.5" }
      - { name: "pg-b",   ip: "10.0.0.6" }
      - { name: "etcd3",  ip: "10.0.0.7" }
    pg_port: 5432
    pg_data_dir: "/var/lib/postgresql/{{ pg_version }}/main"
    pg_max_connections: 200
    pg_shared_buffers: "256MB"

  tasks:
    - name: "Write Patroni config"
      ansible.builtin.template:
        src: "../templates/patroni.yml.j2"
        dest: "/etc/patroni/patroni.yml"
        mode: "0644"
        owner: root
        group: root

    - name: "Create patroni systemd override dir"
      ansible.builtin.file:
        path: "/etc/systemd/system/patroni.service.d"
        state: directory
        mode: "0755"

    - name: "Daemon-reload patroni"
      ansible.builtin.systemd:
        daemon_reload: true


- name: "Patroni HA – Bootstrap: pg-a first (leader)"
  hosts: pg-a
  gather_facts: false
  become: true
  tasks:
    - name: "Create patroni systemd unit"
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Patroni HA PostgreSQL
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=postgres
          Group=postgres
          Environment="PATRONI_CONFIG_PATH=/etc/patroni/patroni.yml"
          ExecStart=/opt/patroni-venv/bin/patroni /etc/patroni/patroni.yml
          Restart=always
          RestartSec=10s
          KillMode=process
          LimitNOFILE=65536

          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/patroni.service"
        mode: "0644"
        owner: root
        group: root

    - name: "Enable Patroni service (don't start yet)"
      ansible.builtin.systemd:
        name: patroni
        enabled: true

    - name: "Start Patroni on pg-a"
      ansible.builtin.systemd:
        name: patroni
        state: started

    - name: "Wait for Patroni REST API on pg-a (30s)"
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 8008
        delay: 5
        timeout: 30

    - name: "Check pg-a leader state"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8008/leader"
        status_code: 200
      register: pg_a_leader
      failed_when: false

    - name: "Show pg-a leader check result"
      ansible.builtin.debug:
        msg: "pg-a leader check: {{ pg_a_leader.status }}"

    - name: "Pause to let pg-a settle as leader (20s)"
      ansible.builtin.pause:
        seconds: 20


- name: "Patroni HA – Bootstrap: pg-b (replica)"
  hosts: pg-b
  gather_facts: false
  become: true
  tasks:
    - name: "Enable Patroni service (don't start yet)"
      ansible.builtin.systemd:
        name: patroni
        enabled: true

    - name: "Start Patroni on pg-b"
      ansible.builtin.systemd:
        name: patroni
        state: started

    - name: "Wait for Patroni REST API on pg-b (30s)"
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 8008
        delay: 5
        timeout: 30

    - name: "Pause to let pg-b join as replica (20s)"
      ansible.builtin.pause:
        seconds: 20


- name: "Patroni HA – Smoke test"
  hosts: pg-a
  gather_facts: false
  become: true

  tasks:
    - name: "Check full cluster status"
      ansible.builtin.shell: |
        export PATRONI_CONFIG_PATH=/etc/patroni/patroni.yml
        patronictl -c /etc/patroni/patroni.yml list
      register: cluster_status
      failed_when: false

    - name: "Show cluster status"
      ansible.builtin.debug:
        msg: "{{ cluster_status.stdout }}{{ cluster_status.stderr }}"

    - name: "Test PostgreSQL connection on pg-a"
      ansible.builtin.shell: |
        psql -h 127.0.0.1 -p 5432 -U postgres -c "SELECT pg_is_in_recovery();" 2>&1
      register: pg_recovery_test
      failed_when: false

    - name: "Show recovery status"
      ansible.builtin.debug:
        msg: "pg-a recovery: {{ pg_recovery_test.stdout }}{{ pg_recovery_test.stderr }}"
