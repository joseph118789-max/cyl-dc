---
# Patroni HA PostgreSQL cluster across 2 PVE sites
# ================================================
# Architecture (3 VMs, 2 sites):
#   PVE1 (Site 1, 192.168.1.x):
#     pg-a  (openclaw01, 192.168.1.239 / 10.0.0.1):
#       Postgres Node A + Patroni + etcd member 1
#   PVE2 (Site 2, 192.168.11.x):
#     pg-b  (VM 105, 192.168.11.239 / 10.0.0.2):
#       Postgres Node B + Patroni + etcd member 2
#     etcd3 (VM 106, 192.168.11.240 / 10.0.0.4):
#       etcd member 3 only (NO PostgreSQL, NO Patroni)
#
# Quorum: 3 etcd votes total. Automatic failover works as long as
# at least 2 of 3 etcd members are reachable.
#
# If PVE2 goes completely offline: pg-a has 1/3 etcd votes,
# cannot reach quorum, will NOT auto-failover. This is correct
# behavior to avoid split-brain. True host-level HA needs a 3rd
# physical failure domain.
#
# Ports:
#   etcd peer:   2380/tcp
#   etcd client: 2379/tcp
#   Patroni API: 8008/tcp
#   Postgres:    5432/tcp
#   HAProxy:     5000/tcp (PgBouncer), 5432 direct (optional)
#
# Verification:
#   patronictl -c /etc/patroni/patroni.yml list
#   etcdctl endpoint health
#   etcdctl member list

- name: "Patroni HA – Prerequisites (data nodes)"
  hosts: [pg-a, pg-b]
  gather_facts: true
  become: true
  vars:
    pg_version: "16"
    cluster_name: "cyl-dc-pg"
    pg_port: 5432
    pg_data_dir: "/var/lib/postgresql/{{ pg_version }}/main"
    pg_max_connections: 200
    pg_shared_buffers: "256MB"
    wg_mtu: 1420

  tasks:
    - name: "Ensure Python + pip + build deps"
      ansible.builtin.apt:
        pkg:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - libpq-dev
          - build-essential
          - libssl-dev
          - pkg-config
          - netcat
        update_cache: true
        state: present

    - name: "Stop + disable default PostgreSQL (Patroni manages it)"
      ansible.builtin.systemd:
        name: "postgresql"
        state: stopped
        enabled: false
      failed_when: false

    - name: "Install PostgreSQL {{ pg_version }}"
      ansible.builtin.apt:
        pkg:
          - "postgresql-{{ pg_version }}"
          - "postgresql-client-{{ pg_version }}"
          - "postgresql-contrib-{{ pg_version }}"
        state: present

    - name: "Install Patroni via pip"
      ansible.builtin.pip:
        name:
          - "patroni[etcd]==4.0.1"
          - "psycopg2-binary"
        virtualenv: /opt/patroni-venv
        virtualenv_command: "python3 -m venv"
        state: present

    - name: "Create Patroni config dir"
      ansible.builtin.file:
        path: "/etc/patroni"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Create postgres data dir"
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: "Create patroni run dir"
      ansible.builtin.file:
        path: "/run/patroni"
        state: directory
        owner: root
        mode: "0755"


- name: "Patroni HA – Etcd (all 3 members: pg-a, pg-b, etcd3)"
  hosts: [pg-a, pg-b, etcd3]
  gather_facts: true
  become: true
  vars:
    etcd_version: "3.9.0"
    cluster_name: "cyl-dc-pg"
    etcd_members:
      - { name: "pg-a",  ip: "10.0.0.1" }
      - { name: "pg-b",  ip: "10.0.0.2" }
      - { name: "etcd3", ip: "10.0.0.4" }
    # Tuned for ~50ms cross-site RTT between PVE1 and PVE2
    etcd_heartbeat_interval: "500"
    etcd_election_timeout: "5000"

  tasks:
    - name: "Install etcd binaries (download if not present)"
      block:
        - name: "Check if etcd binary exists"
          ansible.builtin.stat:
            path: "/usr/local/bin/etcd"
          register: etcd_binary

        - name: "Download etcd {{ etcd_version }}"
          ansible.builtin.get_url:
            url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
            dest: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
            mode: "0644"
          when: not etcd_binary.stat.exists

        - name: "Extract etcd"
          ansible.builtin.unarchive:
            src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
            dest: "/tmp"
            remote_src: true
            creates: "/tmp/etcd-v{{ etcd_version }}-linux-amd64"
          when: not etcd_binary.stat.exists

        - name: "Install etcd binaries"
          ansible.builtin.copy:
            remote_src: true
            src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/etcd/{{ item }}"
            dest: "/usr/local/bin/{{ item }}"
            mode: "0755"
          loop:
            - etcd
            - etcdctl
          when: not etcd_binary.stat.exists
      when: inventory_hostname in ['pg-a', 'pg-b', 'etcd3']

    - name: "Create etcd data dir"
      ansible.builtin.file:
        path: "/var/lib/etcd"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Generate etcd initial cluster string"
      ansible.builtin.set_fact:
        etcd_initial_cluster: >-
          {%- set parts = [] -%}
          {%- for m in etcd_members -%}
          {%- set _ = parts.append(m.name + '=http://' + m.ip + ':2380') -%}
          {%- endfor -%}
          {{ parts | join(',') }}
      when: inventory_hostname in ['pg-a', 'pg-b', 'etcd3']

    - name: "Write etcd config"
      ansible.builtin.template:
        src: "../templates/etcd.conf.yml.j2"
        dest: "/etc/etcd/etcd.conf.yml"
        mode: "0644"
        owner: root
        group: root
      when: inventory_hostname in ['pg-a', 'pg-b', 'etcd3']

    - name: "Create etcd systemd override dir"
      ansible.builtin.file:
        path: "/etc/systemd/system/etcd.service.d"
        state: directory
        mode: "0755"

    - name: "Daemon-reload etcd"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Enable + start etcd"
      ansible.builtin.systemd:
        name: etcd
        state: started
        enabled: true
      when: inventory_hostname in ['pg-a', 'pg-b', 'etcd3']


- name: "Patroni HA – Verify etcd cluster health"
  hosts: pg-a
  gather_facts: false
  become: false
  vars:
    etcd_members:
      - { name: "pg-a",  ip: "10.0.0.1" }
      - { name: "pg-b",  ip: "10.0.0.2" }
      - { name: "etcd3", ip: "10.0.0.4" }

  tasks:
    - name: "Generate etcdctl endpoints"
      ansible.builtin.set_fact:
        etcdctl_endpoints: >-
          {%- for m in etcd_members -%}
          http://{{ m.ip }}:2379{% if not loop.last %},{% endif %}
          {%- endfor %}

    - name: "Wait for etcd cluster to form (60s)"
      ansible.builtin.wait_for:
        timeout: 60

    - name: "Check etcd cluster health"
      ansible.builtin.shell: |
        export ETCDCTL_ENDPOINTS="{{ etcdctl_endpoints }}"
        etcdctl endpoint health --cluster
      register: etcd_health
      failed_when: false

    - name: "Show etcd health"
      ansible.builtin.debug:
        msg: "{{ etcd_health.stdout }}{{ etcd_health.stderr }}"

    - name: "List etcd members"
      ansible.builtin.shell: |
        export ETCDCTL_ENDPOINTS="{{ etcdctl_endpoints }}"
        etcdctl member list
      register: etcd_members_list
      failed_when: false

    - name: "Show etcd members"
      ansible.builtin.debug:
        msg: "{{ etcd_members_list.stdout }}"


- name: "Patroni HA – Patroni config + bootstrap (data nodes only)"
  hosts: [pg-a, pg-b]
  gather_facts: true
  become: true
  vars:
    pg_version: "16"
    cluster_name: "cyl-dc-pg"
    etcd_members:
      - { name: "pg-a",  ip: "10.0.0.1" }
      - { name: "pg-b",  ip: "10.0.0.2" }
      - { name: "etcd3", ip: "10.0.0.4" }
    pg_port: 5432
    pg_data_dir: "/var/lib/postgresql/{{ pg_version }}/main"
    pg_max_connections: 200
    pg_shared_buffers: "256MB"
    wg_mtu: 1420

  tasks:
    - name: "Generate etcdctl endpoints for patroni config"
      ansible.builtin.set_fact:
        etcd_dcs: >-
          {%- for m in etcd_members -%}
          http://{{ m.ip }}:2379{% if not loop.last %},{% endif %}
          {%- endfor %}

    - name: "Write Patroni config"
      ansible.builtin.template:
        src: "../templates/patroni.yml.j2"
        dest: "/etc/patroni/patroni.yml"
        mode: "0644"
        owner: root
        group: root
      notify: "Restart Patroni"

    - name: "Create patroni systemd override dir"
      ansible.builtin.file:
        path: "/etc/systemd/system/patroni.service.d"
        state: directory
        mode: "0755"

    - name: "Daemon-reload patroni"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Enable + start Patroni"
      ansible.builtin.systemd:
        name: patroni
        state: started
        enabled: true

    - name: "Wait for Patroni API to come up (30s)"
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 8008
        delay: 5
        timeout: 30

  handlers:
    - name: "Restart Patroni"
      ansible.builtin.systemd:
        name: patroni
        state: restarted


- name: "Patroni HA – Smoke test"
  hosts: pg-a
  gather_facts: false
  become: true
  vars:
    cluster_name: "cyl-dc-pg"

  tasks:
    - name: "Wait for cluster to settle (30s)"
      ansible.builtin.pause:
        seconds: 30

    - name: "Check cluster status via patronictl"
      ansible.builtin.shell: |
        export PATRONI_CONFIG_PATH=/etc/patroni/patroni.yml
        patronictl -c /etc/patroni/patroni.yml list
      register: cluster_status
      failed_when: false

    - name: "Show cluster status"
      ansible.builtin.debug:
        msg: "{{ cluster_status.stdout }}{{ cluster_status.stderr }}"

    - name: "Test PostgreSQL connection on pg-a"
      ansible.builtin.shell: |
        psql -h 127.0.0.1 -p 5432 -U postgres -c "SELECT version();" 2>&1
      register: pg_test
      failed_when: false

    - name: "Show PostgreSQL version"
      ansible.builtin.debug:
        msg: "{{ pg_test.stdout }}{{ pg_test.stderr }}"
