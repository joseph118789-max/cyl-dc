---
# Production-grade K3s cluster setup across two sites via WireGuard VPN
#
# Key design decisions:
# 1. All k3s node-ip uses LAN IPs (192.168.x.x) — not WireGuard IPs
# 2. Flannel uses default interface (eth0) — flannel.1 handles cross-subnet
# 3. k3s03 (second master) joins using server= with first master's LAN IP
# 4. etcd uses LAN IP for peer communication (flannel handles routing)
# 5. Workers join via k3s01's LAN IP since same subnet works

- name: Prepare all nodes
  hosts: k3s_cluster
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tags:
    - prepare

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - curl
          - jq
          - open-iscsi
          - nfs-common
          - wireguard-tools
        state: present
        update_cache: yes

    - name: Ensure WireGuard is running
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: started
        enabled: true
      ignore_errors: yes

    - name: Ensure wg0 is UP
      ansible.builtin.shell: |
        ip link show wg0 2>/dev/null | grep -q "state UP" || wg-quick up wg0
      changed_when: false

    - name: Add explicit WG routes on k3s01
      ansible.builtin.shell: |
        # k3s01 needs to know how to reach cross-subnet WG peers
        ip route add 10.0.0.3/32 dev wg0 2>/dev/null || true
        ip route add 10.0.0.4/32 dev wg0 2>/dev/null || true
        ip route add 192.168.11.0/24 via 10.0.0.3 dev wg0 2>/dev/null || true
      when: inventory_hostname == 'k3s01'
      changed_when: false

- name: Cleanup existing K3s
  hosts: k3s_cluster
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tags:
    - cleanup
  vars_prompt:
    - name: cleanup
      prompt: "Run cleanup (yes/no)?"
      default: "no"
      private: false

  tasks:
    - name: Stop K3s services
      when: cleanup | bool
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      failed_when: false
      loop:
        - k3s
        - k3s-agent

    - name: Kill remaining K3s processes
      when: cleanup | bool
      ansible.builtin.shell: |
        pkill -9 k3s 2>/dev/null || true
        pkill -9 containerd-shim 2>/dev/null || true
        rm -rf /var/lib/rancher /etc/rancher /run/k3s
      changed_when: false
      failed_when: false

    - name: Reload systemd
      when: cleanup | bool
      ansible.builtin.systemd:
        daemon_reload: yes

- name: Setup First Master (k3s01)
  hosts: master[0]
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tags:
    - master

  tasks:
    - name: Check if already initialized
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_exists

    - name: Initialize K3s master with LAN IP
      when: not kubeconfig_exists.stat.exists
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
        --cluster-init \
        --node-ip={{ hostvars[inventory_hostname].ansible_host }} \
        --tls-san={{ hostvars[inventory_hostname].ansible_host }} \
        --disable traefik \
        --disable servicelb \
        --write-kubeconfig-mode 644 \
        --bind-address={{ hostvars[inventory_hostname].ansible_host }}
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Ensure k3s service is running
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
      ignore_errors: yes

    - name: Wait for API to be ready
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        delay: 5
        timeout: 180

    - name: Get cluster token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token
      when: not kubeconfig_exists.stat.exists

    - name: Save cluster token locally
      when: node_token.content is defined
      ansible.builtin.copy:
        content: "{{ node_token.content | b64decode | trim }}"
        dest: "/tmp/k3s_cluster_token"
        mode: '0644'

    - name: Show master status
      ansible.builtin.shell: |
        k3s kubectl get nodes -o wide 2>&1
      changed_when: false
      register: master_status

    - name: Display master status
      ansible.builtin.debug:
        var: master_status.stdout_lines

- name: Distribute token to all nodes
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tags:
    - token

  tasks:
    - name: Read cluster token
      ansible.builtin.slurp:
        src: /tmp/k3s_cluster_token
      register: token_data
      failed_when: false

    - name: Copy token to all cluster nodes
      ansible.builtin.copy:
        content: "{{ token_data.content | b64decode | trim }}"
        dest: /tmp/k3s_token
        mode: '0644'
      delegate_to: "{{ item }}"
      loop:
        - k3s01
        - k3s02
        - k3s03
        - k3s04

- name: Join Second Master (k3s03)
  hosts: master[1]
  become: true
  vars:
    first_master_lan: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"
    ansible_lan_ip: "{{ hostvars[inventory_hostname]['ansible_host'] }}"
    k3s_token: "{{ lookup('file', '/tmp/k3s_cluster_token') }}"
    ansible_python_interpreter: /usr/bin/python3
  tags:
    - master

  tasks:
    - name: Wait for first master API to be ready
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ first_master_lan }}"
        delay: 10
        timeout: 120

    - name: Check if already a master
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_exists

    - name: Join as second master
      when: not kubeconfig_exists.stat.exists
      environment:
        K3S_TOKEN: "{{ k3s_token }}"
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
        --server https://{{ first_master_lan }}:6443 \
        --node-ip={{ ansible_lan_ip }} \
        --tls-san={{ ansible_lan_ip }} \
        --disable traefik \
        --disable servicelb \
        --write-kubeconfig-mode 644 \
        --bind-address={{ ansible_lan_ip }}
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Ensure k3s service running
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
      ignore_errors: yes

    - name: Wait for master to join
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_lan_ip }}"
        delay: 10
        timeout: 180

    - name: Show k3s03 status
      ansible.builtin.shell: |
        k3s kubectl get nodes 2>&1 | grep k3s03 || echo "k3s03 not yet visible"
      changed_when: false
      register: k3s03_status

    - name: Debug k3s03 join
      ansible.builtin.debug:
        var: k3s03_status.stdout_lines

- name: Join Worker Nodes
  hosts: worker
  become: true
  vars:
    first_master_lan: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"
    ansible_lan_ip: "{{ hostvars[inventory_hostname]['ansible_host'] }}"
    k3s_token: "{{ lookup('file', '/tmp/k3s_cluster_token') }}"
    ansible_python_interpreter: /usr/bin/python3
  tags:
    - worker

  tasks:
    - name: Wait for master API
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ first_master_lan }}"
        delay: 5
        timeout: 120

    - name: Check if already joined
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s-agent.yaml
      register: agent_config_exists

    - name: Install K3s agent
      when: not agent_config_exists.stat.exists
      environment:
        K3S_URL: "https://{{ first_master_lan }}:6443"
        K3S_TOKEN: "{{ k3s_token }}"
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - agent \
        --node-ip={{ ansible_lan_ip }}
      args:
        creates: /etc/rancher/k3s/k3s-agent.yaml

    - name: Start k3s-agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: true
      ignore_errors: yes

- name: Verify cluster status
  hosts: master[0]
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tags:
    - verify

  tasks:
    - name: Wait for all nodes
      ansible.builtin.shell: |
        for i in {1..30}; do
          sleep 10
          NODES=$(k3s kubectl get nodes 2>/dev/null | grep -v NAME | wc -l)
          echo "$(date '+%H:%M:%S') - $NODES nodes visible"
          if [ "$NODES" -ge 4 ]; then
            echo "SUCCESS: All $NODES nodes joined"
            break
          fi
        done
        echo "=== Current Nodes ==="
        k3s kubectl get nodes -o wide
        echo "=== Pods ==="
        k3s kubectl get pods -A
      changed_when: false
      register: cluster_verify

    - name: Show cluster verification
      ansible.builtin.debug:
        var: cluster_verify.stdout_lines