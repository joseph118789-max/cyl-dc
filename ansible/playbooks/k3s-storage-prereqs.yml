---
# K3s Storage Prerequisites Playbook
# Installs dependencies needed for Longhorn and NFS storage on K3s nodes
# Usage: ansible-playbook playbooks/k3s-storage-prereqs.yml

- name: Install storage prerequisites on K3s nodes
  hosts: k3s_cluster
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install open-iscsi
      ansible.builtin.apt:
        name: open-iscsi
        state: present

    - name: Install nfs-common
      ansible.builtin.apt:
        name: nfs-common
        state: present

    - name: Enable iscsid service
      ansible.builtin.systemd:
        name: iscsid
        enabled: yes
        state: started

    - name: Verify installations
      ansible.builtin.shell:
        cmd: |
          iscsiadm --version
          showmount --version | head -1
      register: verification
      changed_when: false

    - name: Display results
      ansible.builtin.debug:
        var: verification.stdout_lines