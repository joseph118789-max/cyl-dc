---
# HAProxy + PgBouncer for Patroni HA PostgreSQL
# ============================================
# Runs on: haproxy_nodes (pg-a, pg-b only)
# etcd3 is excluded — it has no Patroni REST API (8008) or Postgres (5432)
#
# HAProxy polls Patroni REST API (port 8008) on each node.
# Patroni returns 200 OK only on the current leader.
# HAProxy therefore routes writes to the correct node automatically.
#
# Listener ports:
#   5432: Postgres write traffic (→ leader only, httpchk /leader 200)
#   5433: Postgres replica-read (→ replicas only, httpchk /replica 200)
#   5000: PgBouncer (transaction pool, routes to local Postgres)
#   5001: HAProxy stats
#
# HAProxy does NOT speak to etcd3 — etcd3 has no Patroni/Postgres.

- name: "HAProxy + PgBouncer – Install (data nodes only)"
  hosts: haproxy_nodes
  become: true
  vars:
    pg_port: 5432
    pgbouncer_port: 5000
    haproxy_stats_port: 5001

  tasks:
    - name: "Install HAProxy + socat"
      ansible.builtin.apt:
        pkg:
          - haproxy
          - socat
        update_cache: true
        state: present

    - name: "Install PgBouncer"
      ansible.builtin.apt:
        pkg:
          - pgbouncer
        state: present

    - name: "Stop default haproxy (we manage config)"
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
        enabled: false
      failed_when: false

    - name: "Stop default pgbouncer (we manage config)"
      ansible.builtin.systemd:
        name: pgbouncer
        state: stopped
        enabled: false
      failed_when: false


- name: "HAProxy + PgBouncer – Configure (data nodes only)"
  hosts: haproxy_nodes
  become: true
  vars:
    pg_port: 5432
    pgbouncer_port: 5000
    haproxy_stats_port: 5001
    # db_members: only patroni data nodes — NOT etcd3
    # etcd3 has no Patroni (8008) and no Postgres (5432)
    db_members:
      - { name: "pg-a",  ip: "10.0.0.1" }
      - { name: "pg-b",  ip: "10.0.0.2" }

  tasks:
    - name: "Write HAProxy config"
      ansible.builtin.template:
        src: "../templates/haproxy.cfg.j2"
        dest: "/etc/haproxy/haproxy.cfg"
        mode: "0644"
        owner: root
        group: root
      notify: "Restart HAProxy"

    - name: "Create HAProxy systemd override dir"
      ansible.builtin.file:
        path: "/etc/systemd/system/haproxy.service.d"
        state: directory
        mode: "0755"

    - name: "Daemon-reload haproxy"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Enable + start HAProxy"
      ansible.builtin.systemd:
        name: haproxy
        state: started
        enabled: true

    - name: "Write PgBouncer ini"
      ansible.builtin.template:
        src: "../templates/pgbouncer.ini.j2"
        dest: "/etc/pgbouncer/pgbouncer.ini"
        mode: "0644"
        owner: pgbouncer
        group: pgbouncer
      notify: "Restart PgBouncer"

    - name: "Write PgBouncer userlist"
      ansible.builtin.template:
        src: "../templates/pgbouncer.userlist.j2"
        dest: "/etc/pgbouncer/userlist.txt"
        mode: "0600"
        owner: pgbouncer
        group: pgbouncer
      notify: "Restart PgBouncer"

    - name: "Create PgBouncer run dir"
      ansible.builtin.file:
        path: "/run/pgbouncer"
        state: directory
        owner: pgbouncer
        mode: "0755"

    - name: "Enable + start PgBouncer"
      ansible.builtin.systemd:
        name: pgbouncer
        state: started
        enabled: true

    - name: "Open firewall ports (ufw)"
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ pgbouncer_port }}"
        - "{{ haproxy_stats_port }}"
      failed_when: false

  handlers:
    - name: "Restart HAProxy"
      ansible.builtin.systemd:
        name: haproxy
        state: restarted

    - name: "Restart PgBouncer"
      ansible.builtin.systemd:
        name: pgbouncer
        state: restarted
