---
# MetalLB Installation Playbook for K3s
# Usage: ansible-playbook playbooks/metallb.yml

- name: Install MetalLB on K3s Cluster
  hosts: master
  become: yes
  gather_facts: yes
  vars:
    metallb_version: v0.14.5
    ip_pool_start: 192.168.1.200
    ip_pool_end: 192.168.1.250

  tasks:
    - name: Apply MetalLB manifests (first master only)
      ansible.builtin.shell:
        cmd: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml --validate=false
      register: metallb_install
      changed_when: "'created' in metallb_install.stdout or 'configured' in metallb_install.stdout"
      when: inventory_hostname == groups['master'][0]

    - name: Wait for MetalLB pods to be ready
      ansible.builtin.shell:
        cmd: kubectl get pods -n metallb-system -o jsonpath='{.items[*].status.phase}'
      register: pod_status
      until: "'Running Running' in pod_status.stdout or pod_status.stdout == 'Running'"
      retries: 30
      delay: 5
      changed_when: false
      when: inventory_hostname == groups['master'][0]

    - name: Create IPAddressPool config (first master only)
      ansible.builtin.copy:
        dest: /tmp/metallb-config.yaml
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default-pool
            namespace: metallb-system
          spec:
            addresses:
            - {{ ip_pool_start }}-{{ ip_pool_end }}
            autoAssign: true
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: l2-adv
            namespace: metallb-system
          spec:
            ipAddressPools:
            - default-pool
      when: inventory_hostname == groups['master'][0]

    - name: Delete MetalLB webhook if stuck (workaround)
      ansible.builtin.shell:
        cmd: kubectl delete validatingwebhookconfiguration metallb-webhook-configuration --ignore-not-found=true
      changed_when: false
      when: inventory_hostname == groups['master'][0]

    - name: Apply MetalLB IPAddressPool (first master only)
      ansible.builtin.shell:
        cmd: |
          kubectl apply -f - <<EOF
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default-pool
            namespace: metallb-system
          spec:
            addresses:
            - {{ ip_pool_start }}-{{ ip_pool_end }}
            autoAssign: true
          EOF
      register: metallb_config
      changed_when: "'created' in metallb_config.stdout"
      when: inventory_hostname == groups['master'][0]

    - name: Apply MetalLB L2Advertisement (first master only)
      ansible.builtin.shell:
        cmd: |
          kubectl apply -f - <<EOF
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: l2-adv
            namespace: metallb-system
          spec:
            ipAddressPools:
            - default-pool
          EOF
      register: l2adv
      changed_when: "'created' in l2adv.stdout"
      when: inventory_hostname == groups['master'][0]

    - name: Verify MetalLB installation
      ansible.builtin.shell:
        cmd: kubectl get pods -n metallb-system && kubectl get ipaddresspools -A
      register: verification
      changed_when: false

    - name: Display installation results
      ansible.builtin.debug:
        var: verification.stdout_lines