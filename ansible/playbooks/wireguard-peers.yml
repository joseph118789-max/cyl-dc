---
# WireGuard peer configuration for cross-site K3s cluster
# All cluster nodes get a full mesh of peers
# Cross-subnet nodes use explicit Endpoint; same-subnet peers don't need Endpoint

- name: Install WireGuard tools
  hosts: k3s_cluster
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Install wireguard-tools
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: yes

- name: Collect WireGuard keys from all nodes
  hosts: k3s_cluster
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Generate WireGuard keypair
      when: hostvars[inventory_hostname].wg_private_key is not defined
      block:
        - name: Generate private key
          ansible.builtin.shell: wg genkey
          register: gen_private_key
          changed_when: false

        - name: Generate public key
          ansible.builtin.shell: "echo {{ gen_private_key.stdout }} | wg pubkey"
          register: gen_public_key
          changed_when: false

        - name: Store keys as facts
          ansible.builtin.set_fact:
            wg_private_key: "{{ gen_private_key.stdout }}"
            wg_public_key: "{{ gen_public_key.stdout }}"

- name: Gather public keys on localhost
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Get k3s01 public key
      ansible.builtin.shell: |
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 user@192.168.1.150 \
          "sudo wg show wg0 public-key 2>/dev/null || echo NOT_SET"
      changed_when: false
      register: k3s01_key_result

    - name: Get k3s02 public key
      ansible.builtin.shell: |
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 user@192.168.1.151 \
          "sudo wg show wg0 public-key 2>/dev/null || echo NOT_SET"
      changed_when: false
      register: k3s02_key_result

    - name: Get k3s03 public key
      ansible.builtin.shell: |
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 user@192.168.11.150 \
          "sudo wg show wg0 public-key 2>/dev/null || echo NOT_SET"
      changed_when: false
      register: k3s03_key_result

    - name: Get k3s04 public key
      ansible.builtin.shell: |
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 user@192.168.11.151 \
          "sudo wg show wg0 public-key 2>/dev/null || echo NOT_SET"
      changed_when: false
      register: k3s04_key_result

    - name: Set public key facts
      ansible.builtin.set_fact:
        k3s01_public: "{{ k3s01_key_result.stdout | trim }}"
        k3s02_public: "{{ k3s02_key_result.stdout | trim }}"
        k3s03_public: "{{ k3s03_key_result.stdout | trim }}"
        k3s04_public: "{{ k3s04_key_result.stdout | trim }}"
        k3s01_private: "{{ hostvars['k3s01'].wg_private_key | default('NOT_SET') }}"
        k3s02_private: "{{ hostvars['k3s02'].wg_private_key | default('NOT_SET') }}"
        k3s03_private: "{{ hostvars['k3s03'].wg_private_key | default('NOT_SET') }}"
        k3s04_private: "{{ hostvars['k3s04'].wg_private_key | default('NOT_SET') }}"

    - name: Show collected keys
      ansible.builtin.debug:
        msg: |
          k3s01: pub={{ k3s01_public }} priv={{ k3s01_private[:20] }}...
          k3s02: pub={{ k3s02_public }} priv={{ k3s02_private[:20] }}...
          k3s03: pub={{ k3s03_public }} priv={{ k3s03_private[:20] }}...
          k3s04: pub={{ k3s04_public }} priv={{ k3s04_private[:20] }}...

- name: Configure WireGuard on k3s01
  hosts: k3s01
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    my_lan: "192.168.1.150"
    my_wg: "10.0.0.1"
    peer_k3s02_wg: "10.0.0.2"
    peer_k3s02_lan: "192.168.1.151"
    peer_k3s03_wg: "10.0.0.3"
    peer_k3s03_lan: "192.168.11.150"
    peer_k3s04_wg: "10.0.0.4"
    peer_k3s04_lan: "192.168.11.151"
    k3s02_pub: "{{ hostvars['k3s02'].wg_public_key | default('NOT_SET') }}"
    k3s03_pub: "{{ hostvars['k3s03'].wg_public_key | default('NOT_SET') }}"
    k3s04_pub: "{{ hostvars['k3s04'].wg_public_key | default('NOT_SET') }}"
    k3s01_priv: "{{ hostvars['k3s01'].wg_private_key | default('NOT_SET') }}"

  tasks:
    - name: Deploy wg0.conf for k3s01
      ansible.builtin.copy:
        dest: /etc/wireguard/wg0.conf
        content: |
          [Interface]
          Address = {{ my_wg }}/24
          PrivateKey = {{ k3s01_priv }}
          ListenPort = 51820

          # k3s02 - same subnet (192.168.1.x), direct route
          [Peer]
          PublicKey = {{ k3s02_pub }}
          AllowedIPs = {{ peer_k3s02_wg }}/32, {{ peer_k3s02_lan }}/32
          PersistentKeepalive = 25

          # k3s03 - cross subnet (192.168.11.x), needs endpoint
          [Peer]
          PublicKey = {{ k3s03_pub }}
          AllowedIPs = {{ peer_k3s03_wg }}/32, {{ peer_k3s03_lan }}/32
          Endpoint = {{ peer_k3s03_lan }}:51820
          PersistentKeepalive = 25

          # k3s04 - cross subnet (192.168.11.x), needs endpoint
          [Peer]
          PublicKey = {{ k3s04_pub }}
          AllowedIPs = {{ peer_k3s04_wg }}/32, {{ peer_k3s04_lan }}/32
          Endpoint = {{ peer_k3s04_lan }}:51820
          PersistentKeepalive = 25
        mode: '0600'

    - name: Restart wg0 on k3s01
      ansible.builtin.shell: |
        wg-quick down wg0 2>/dev/null || true
        ip link del wg0 2>/dev/null || true
        wg-quick up wg0
        sleep 2
        wg show
      changed_when: false

