- name: Verify all WG connections
  hosts: k3s_cluster
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Check WG status
      ansible.builtin.shell: |
        echo "=== {{ inventory_hostname }} ==="
        wg show wg0 2>&1
        ip link show wg0 2>&1 | head -3
      changed_when: false

    - name: Test cross-subnet reachability from k3s03
      when: inventory_hostname == 'k3s03'
      ansible.builtin.shell: |
        timeout 10 bash -c "curl -k https://192.168.1.150:6443/ --connect-timeout 5 2>&1" || echo "FAILED_k3s01_6443"
        timeout 10 bash -c "nc -z 192.168.1.150 2379 2>&1" || echo "FAILED_k3s01_2379"
      changed_when: false
      ignore_errors: yes