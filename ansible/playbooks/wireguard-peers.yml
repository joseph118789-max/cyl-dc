          PublicKey = {{ k3s03_pub }}
          AllowedIPs = 10.0.0.3/32, 192.168.11.150/32
          Endpoint = 192.168.11.150:51820
          PersistentKeepalive = 25

          # k3s04 - cross subnet, needs endpoint
          [Peer]
          PublicKey = {{ k3s04_pub }}
          AllowedIPs = 10.0.0.4/32, 192.168.11.151/32
          Endpoint = 192.168.11.151:51820
          PersistentKeepalive = 25
        mode: '0600'

    - name: Restart wg0 on k3s02
      ansible.builtin.shell: |
        wg-quick down wg0 2>/dev/null || true
        ip link del wg0 2>/dev/null || true
        wg-quick up wg0
        sleep 2
        wg show
      changed_when: false

