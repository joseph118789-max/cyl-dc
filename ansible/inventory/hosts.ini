# K3s cluster inventory - WireGuard full-mesh overlay
# Site 1 (PVE - 192.168.1.0/24): k3s01, k3s02
# Site 2 (PVE2 - 192.168.11.0/24): k3s03, k3s04
# WireGuard overlay: 10.0.0.0/24

[master]
k3s01 ansible_host=192.168.1.150   wireguard_ip=10.0.0.1/32
k3s03 ansible_host=192.168.11.150  wireguard_ip=10.0.0.3/32

[worker]
k3s02 ansible_host=192.168.1.151   wireguard_ip=10.0.0.2/32
k3s04 ansible_host=192.168.11.151 wireguard_ip=10.0.0.4/32

[k3s_cluster:children]
master
worker

[pve_nodes]
k3s01 ansible_host=192.168.1.150   wireguard_ip=10.0.0.1/32
k3s02 ansible_host=192.168.1.151   wireguard_ip=10.0.0.2/32
k3s03 ansible_host=192.168.11.150  wireguard_ip=10.0.0.3/32
k3s04 ansible_host=192.168.11.151 wireguard_ip=10.0.0.4/32

[all:vars]
ansible_user=user
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# ============================================================
# Patroni HA PostgreSQL cluster (3 VMs, 2 PVE sites)
# ============================================================
# PVE1 (Site 1, 192.168.1.x):
#   pg-a  = openclaw01 (this host), 192.168.1.239, WireGuard 10.0.0.1
#           PostgreSQL + Patroni + etcd member 1
# PVE2 (Site 2, 192.168.11.x):
#   pg-b  = VM 105 (ubuntu24-base-3), 192.168.11.239, WireGuard 10.0.0.2
#           PostgreSQL + Patroni + etcd member 2
#   etcd3 = VM 106 (ubuntu24-base-4), 192.168.11.240, WireGuard 10.0.0.4
#           etcd member 3 ONLY (no PostgreSQL, no Patroni)
#
# Quorum: 2/3 etcd votes. If PVE2 goes offline, PVE1 has 1/3
# etcd votes and will NOT auto-failover. This is correct behavior
# to avoid split-brain. True host-level HA needs a 3rd physical
# failure domain.
# ============================================================

[patroni_cluster]
pg-a     ansible_host=127.0.0.1   ansible_connection=local  wireguard_ip=10.0.0.1
pg-b     ansible_host=192.168.11.239  wireguard_ip=10.0.0.2
etcd3    ansible_host=192.168.11.240  wireguard_ip=10.0.0.4