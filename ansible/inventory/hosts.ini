# K3s cluster inventory - WireGuard full-mesh overlay
# Site 1 (PVE - 192.168.1.0/24): k3s01, k3s02
# Site 2 (PVE2 - 192.168.11.0/24): k3s03, k3s04
# WireGuard overlay: 10.0.0.0/24

[master]
k3s01 ansible_host=192.168.1.150   wireguard_ip=10.0.0.1/32
k3s03 ansible_host=192.168.11.150  wireguard_ip=10.0.0.3/32

[worker]
k3s02 ansible_host=192.168.1.151   wireguard_ip=10.0.0.2/32
k3s04 ansible_host=192.168.11.151 wireguard_ip=10.0.0.4/32

[k3s_cluster:children]
master
worker

[pve_nodes]
k3s01 ansible_host=192.168.1.150   wireguard_ip=10.0.0.1/32
k3s02 ansible_host=192.168.1.151   wireguard_ip=10.0.0.2/32
k3s03 ansible_host=192.168.11.150  wireguard_ip=10.0.0.3/32
k3s04 ansible_host=192.168.11.151 wireguard_ip=10.0.0.4/32

[all:vars]
ansible_user=user
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'