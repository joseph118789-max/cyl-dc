apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traccar-data
  namespace: traccar
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traccar-logs
  namespace: traccar
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traccar-conf
  namespace: traccar
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
