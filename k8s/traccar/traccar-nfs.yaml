# Traccar K8s Migration - Using NFS volumes directly
# Data is at /mnt/nfs/traccar (NFS from 192.168.1.130)
---
apiVersion: v1
kind: Namespace
metadata:
  name: traccar
  labels:
    app: traccar
    environment: production
---
# NFS Storage Volume (using existing /mnt/nfs/traccar mount)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: traccar-nfs
  labels:
    type: traccar
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.130
    path: /workspace/traccar/traccar/traccar
---
# Traccar Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traccar
  namespace: traccar
  labels:
    app: traccar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traccar
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: traccar
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirst
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
      containers:
        - name: traccar
          image: traccar/traccar:5.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              hostPort: 8082
              protocol: TCP
            - containerPort: 5001
              hostPort: 5001
              protocol: TCP
            - containerPort: 5009
              hostPort: 5009
              protocol: TCP
            - containerPort: 5014
              hostPort: 5014
              protocol: TCP
            - containerPort: 5020
              hostPort: 5020
              protocol: TCP
            - containerPort: 5023
              hostPort: 5023
              protocol: TCP
            - containerPort: 5027
              hostPort: 5027
              protocol: TCP
            - containerPort: 5111
              hostPort: 5111
              protocol: TCP
            - containerPort: 5300
              hostPort: 5300
              protocol: TCP
            - containerPort: 5301
              hostPort: 5301
              protocol: TCP
          volumeMounts:
            - name: traccar-data
              mountPath: /opt/traccar/data
            - name: traccar-logs
              mountPath: /opt/traccar/logs
            - name: traccar-conf
              mountPath: /opt/traccar/conf
              readOnly: true
            - name: traccar-web
              mountPath: /opt/traccar/web
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/server
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/server
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: traccar-data
          nfs:
            server: 192.168.1.130
            path: /workspace/traccar/traccar/traccar/data
        - name: traccar-logs
          nfs:
            server: 192.168.1.130
            path: /workspace/traccar/traccar/traccar/logs
        - name: traccar-conf
          nfs:
            server: 192.168.1.130
            path: /workspace/traccar/traccar/traccar/conf
            readOnly: true
        - name: traccar-web
          nfs:
            server: 192.168.1.130
            path: /workspace/traccar/traccar/traccar/web