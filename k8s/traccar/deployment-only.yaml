# Traccar Deployment - apply AFTER PVCs are Bound
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traccar
  namespace: traccar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traccar
  template:
    metadata:
      labels:
        app: traccar
    spec:
      hostNetwork: true
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
      containers:
        - name: traccar
          image: traccar/traccar:5.9
          ports:
            - containerPort: 8082
              hostPort: 8082
            - containerPort: 5001
              hostPort: 5001
            - containerPort: 5009
              hostPort: 5009
            - containerPort: 5014
              hostPort: 5014
            - containerPort: 5020
              hostPort: 5020
            - containerPort: 5023
              hostPort: 5023
            - containerPort: 5027
              hostPort: 5027
            - containerPort: 5111
              hostPort: 5111
            - containerPort: 5300
              hostPort: 5300
            - containerPort: 5301
              hostPort: 5301
          volumeMounts:
            - name: traccar-data
              mountPath: /opt/traccar/data
            - name: traccar-logs
              mountPath: /opt/traccar/logs
            - name: traccar-conf
              mountPath: /opt/traccar/conf
              readOnly: true
            - name: traccar-web
              mountPath: /opt/traccar/web
          livenessProbe:
            httpGet:
              path: /api/server
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/server
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: traccar-data
          persistentVolumeClaim:
            claimName: traccar-data
        - name: traccar-logs
          persistentVolumeClaim:
            claimName: traccar-logs
        - name: traccar-conf
          persistentVolumeClaim:
            claimName: traccar-conf
        - name: traccar-web
          persistentVolumeClaim:
            claimName: traccar-web