# Traccar K8s Migration Manifests - Fixed
# Using built-in longhorn storage class (which supports RWX)
# Target: k3s0 cluster

---
apiVersion: v1
kind: Namespace
metadata:
  name: traccar
  labels:
    app: traccar
    environment: production
---
# PVC: Data directory (using longhorn storage class with RWX)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traccar-data
  namespace: traccar
  labels:
    app: traccar
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# PVC: Logs directory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traccar-logs
  namespace: traccar
  labels:
    app: traccar
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# PVC: Configuration directory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traccar-conf
  namespace: traccar
  labels:
    app: traccar
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# PVC: Web interface
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traccar-web
  namespace: traccar
  labels:
    app: traccar
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# Traccar Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traccar
  namespace: traccar
  labels:
    app: traccar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traccar
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: traccar
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirst
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
      containers:
        - name: traccar
          image: traccar/traccar:5.9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              hostPort: 8082
              protocol: TCP
            - containerPort: 5001
              hostPort: 5001
              protocol: TCP
            - containerPort: 5009
              hostPort: 5009
              protocol: TCP
            - containerPort: 5014
              hostPort: 5014
              protocol: TCP
            - containerPort: 5020
              hostPort: 5020
              protocol: TCP
            - containerPort: 5023
              hostPort: 5023
              protocol: TCP
            - containerPort: 5027
              hostPort: 5027
              protocol: TCP
            - containerPort: 5111
              hostPort: 5111
              protocol: TCP
            - containerPort: 5300
              hostPort: 5300
              protocol: TCP
            - containerPort: 5301
              hostPort: 5301
              protocol: TCP
          volumeMounts:
            - name: traccar-data
              mountPath: /opt/traccar/data
            - name: traccar-logs
              mountPath: /opt/traccar/logs
            - name: traccar-conf
              mountPath: /opt/traccar/conf
              readOnly: true
            - name: traccar-web
              mountPath: /opt/traccar/web
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/server
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/server
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: traccar-data
          persistentVolumeClaim:
            claimName: traccar-data
        - name: traccar-logs
          persistentVolumeClaim:
            claimName: traccar-logs
        - name: traccar-conf
          persistentVolumeClaim:
            claimName: traccar-conf
        - name: traccar-web
          persistentVolumeClaim:
            claimName: traccar-web